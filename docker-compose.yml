services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: pathfinder-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    ports:
      - "8765:8765"
    network_mode: host
    cap_add:
      - SYS_PTRACE

  foxglove:
    image: husarion/foxglove:1.84.0-20240119
    ports:
      - "8080:8080"
    volumes:
      - ./foxglove/layouts/default.json:/foxglove/default-layout.json:ro
    restart: unless-stopped
