services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: pathfinder-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
    ports:
      - "8765:8765"
    network_mode: host
    cap_add:
      - SYS_PTRACE
